#
## GENERAL
#

monitor=eDP-1,preferred,auto,auto
monitor=HDMI-A-1, 1920x1080@60, auto, 1 

$terminal = uwsm app -- ghostty
$prog_menu = uwsm app -- wofi --show drun

#
## EXEC
#

exec-once = uwsm app -- hyprpm reload -n
exec-once = uwsm app -- waybar
# exec-once = uwsm app -- hyprpaper

env = HYPRCURSOR_THEME,BreezeX-Light-hyprcursor
env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20

#
## CONFIG
#

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgb(293233)
	col.inactive_border = rgb(171717)
    resize_on_border = true
	hover_icon_on_border = true
    allow_tearing = false
    layout = master
	snap {
		enabled = true
		window_gap = 5
		monitor_gap = 5
	}
}

master {
	allow_small_split = true
	mfact = 0.70
}

decoration {
    rounding = 0
    rounding_power = 4
	dim_inactive = true
	dim_strength = 0.4
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = no, please :)
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

misc {
    disable_hyprland_logo = true
	vrr = 0
}

input {
    kb_layout = us
    follow_mouse = 1
	sensitivity = -0.5
	accel_profile = flat
    touchpad {
		scroll_factor = 0.6
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = true
	workspace_swipe_fingers = 3
}
plugin {
    split-monitor-workspaces {
        count = 5
        keep_focused = 0
        enable_notifications = 0
        enable_persistent_workspaces = 1
    }
}

#
## KEYBINDS  
# 

## Main

$mainMod = SUPER 

bind = $mainMod Shift, Return, exec, $terminal
bind = $mainMod, D, exec, $prog_menu
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,

## Window
# Move focus 
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Resize window 
bind = $mainMod CTRL, H, resizeactive, -50 0
bind = $mainMod CTRL, L, resizeactive, 50 0 
bind = $mainMod CTRL, K, resizeactive, 0 -50
bind = $mainMod CTRL, J, resizeactive, 0 50

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

## Master Layout

bind = $mainMod, Z, layoutmsg, orientationcycle
bind = $mainMod, TAB, layoutmsg, rollnext
bind = $mainMod SHIFT, TAB, layoutmsg, rollprev

bind = $mainMod, a, layoutmsg, addmaster
bind = $mainMod SHIFT, a, layoutmsg, removemaster

## Workspace
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, split-movetoworkspace, 1
bind = $mainMod SHIFT, 2, split-movetoworkspace, 2
bind = $mainMod SHIFT, 3, split-movetoworkspace, 3
bind = $mainMod SHIFT, 4, split-movetoworkspace, 4
bind = $mainMod SHIFT, 5, split-movetoworkspace, 5

## Media
# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

#### WINDOWRULES

# Firefox Picture-in-Picture Rules
windowrule = float, title:^(Picture-in-Picture)$
windowrule = nodim, title:^(Picture-in-Picture)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
